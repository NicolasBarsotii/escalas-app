<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0c66e4">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Escalas da Mídia</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Banner de Modo Visualização (só aparece quando aberto por link) -->
    <div class="view-mode-banner" id="view-mode-banner" style="display: none;">
        <span>👁️ Modo Visualização</span>
        <button onclick="exitViewMode()">Sair</button>
    </div>

    <!-- Header estilo Trello -->
    <header id="main-header">
        <button class="header-icon-btn" onclick="toggleSidebar()" aria-label="Menu">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                <rect x="3" y="4" width="7" height="16" rx="1.5"/>
                <rect x="14" y="4" width="7" height="16" rx="1.5"/>
            </svg>
        </button>
        <div class="header-title">
            <span>Escalas da Mídia</span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" class="header-arrow">
                <path d="M7 10l5 5 5-5z"/>
            </svg>
        </div>
        <button class="header-icon-btn" onclick="openExportModal()" aria-label="Exportar">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/>
                <polyline points="16 6 12 2 8 6"/>
                <line x1="12" y1="2" x2="12" y2="15"/>
            </svg>
        </button>
        <button class="header-icon-btn" onclick="toggleHeaderMenu()" aria-label="Mais">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                <circle cx="12" cy="5" r="1.8"/>
                <circle cx="12" cy="12" r="1.8"/>
                <circle cx="12" cy="19" r="1.8"/>
            </svg>
        </button>
    </header>

    <div class="sidebar-overlay" id="sidebar-overlay" onclick="closeSidebar()"></div>

    <div class="main-container">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h3>Calendário</h3>
                <button class="header-icon-btn" onclick="closeSidebar()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>
            <div class="calendar-header">
                <button class="btn-nav" onclick="prevMonth()">&#10094;</button>
                <h3 id="month-year-display">Mês Ano</h3>
                <button class="btn-nav" onclick="nextMonth()">&#10095;</button>
            </div>
            <div class="calendar-weekdays">
                <span>D</span><span>S</span><span>T</span><span>Q</span><span>Q</span><span>S</span><span>S</span>
            </div>
            <div class="calendar-grid" id="calendar-body"></div>
            <div class="calendar-footer">
                <button class="btn btn-secondary btn-full" id="btn-nova-escala-avulsa" onclick="openNewEventModal()">+ Nova Escala Avulsa</button>
            </div>
        </aside>

        <main class="content">
            <div class="board" id="board"></div>
            <button class="fab-add-week" id="fab-add-week" onclick="openColumnModal()" aria-label="Nova Semana">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                    <line x1="12" y1="5" x2="12" y2="19"/>
                    <line x1="5" y1="12" x2="19" y2="12"/>
                </svg>
            </button>
        </main>
    </div>

    <nav class="bottom-nav" id="bottom-nav">
        <button class="bottom-nav-item" onclick="toggleSidebar()">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <rect x="3" y="4" width="18" height="18" rx="2"/>
                <line x1="16" y1="2" x2="16" y2="6"/>
                <line x1="8" y1="2" x2="8" y2="6"/>
                <line x1="3" y1="10" x2="21" y2="10"/>
            </svg>
            <span>Agenda</span>
        </button>
        <button class="bottom-nav-item active">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <rect x="3" y="3" width="7" height="18" rx="1.5"/>
                <rect x="14" y="3" width="7" height="18" rx="1.5"/>
            </svg>
            <span>Quadro</span>
        </button>
        <button class="bottom-nav-item" id="btn-criar-bottom" onclick="openNewEventModal()">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <line x1="12" y1="5" x2="12" y2="19"/>
                <line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
            <span>Criar</span>
        </button>
        <button class="bottom-nav-item" onclick="openExportModal()">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/>
                <polyline points="16 6 12 2 8 6"/>
                <line x1="12" y1="2" x2="12" y2="15"/>
            </svg>
            <span>Exportar</span>
        </button>
    </nav>

    <!-- Modal de Detalhes do Dia -->
    <div class="modal-overlay" id="day-details-modal">
        <div class="modal modal-small">
            <div class="modal-header-sticky">
                <h2 id="day-details-title">Cultos do Dia</h2>
                <button type="button" class="btn-close-modal" onclick="closeDayDetailsModal()">✕</button>
            </div>
            <div id="day-details-list" class="day-list"></div>
            <div class="modal-actions">
                <button type="button" class="btn btn-cancel" onclick="closeDayDetailsModal()">Fechar</button>
                <button type="button" class="btn btn-save" id="btn-add-from-calendar" onclick="addEventFromCalendar()">+ Adicionar</button>
            </div>
        </div>
    </div>

    <!-- Modal para Criar Nova Semana -->
    <div class="modal-overlay" id="column-modal-overlay">
        <div class="modal modal-small">
            <div class="modal-header-sticky">
                <h2>Nova Semana</h2>
                <button type="button" class="btn-close-modal" onclick="closeColumnModal()">✕</button>
            </div>
            <form id="column-form">
                <label>Título da Semana:</label>
                <input type="text" id="new-col-title" placeholder="Ex: Semana do dia 07/10 ao 11/10" required>
                <div class="modal-actions">
                    <button type="button" class="btn btn-cancel" onclick="closeColumnModal()">Cancelar</button>
                    <button type="submit" class="btn btn-save">Criar Semana</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal para Editar/Criar Evento -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal">
            <div class="modal-header-sticky">
                <h2 id="modal-title">Editar Escala</h2>
                <button type="button" class="btn-close-modal" onclick="closeModal()">✕</button>
            </div>
            <form id="edit-form">
                <div id="column-select-container" class="col-select-container" style="display: none;">
                    <label>Semana (Coluna):</label>
                    <select id="edit-col-id-select">
                        <option value="">Carregando...</option>
                    </select>
                </div>

                <input type="hidden" id="edit-col-id">
                <input type="hidden" id="edit-evt-id">
                
                <div class="modal-grid">
                    <div class="modal-left">
                        <label>Nome do Culto:</label>
                        <input type="text" id="edit-evt-name" required placeholder="Ex: Culto de Ensino">
                        
                        <label>Data (DD/MM):</label>
                        <input type="text" id="edit-evt-date" placeholder="Ex: 30/09" required inputmode="numeric">

                        <label>Escala:</label>
                        <div id="roles-container"></div>
                        <button type="button" class="btn btn-secondary btn-add-role" onclick="addRoleField()">+ Adicionar Função</button>
                    </div>
                    
                    <div class="modal-right">
                        <label>Bloco de Notas (Interno):</label>
                        <textarea id="edit-evt-notes" rows="5" placeholder="Anotações gerais, avisos para a equipe..."></textarea>
                    </div>
                </div>

                <div class="modal-bottom">
                    <label>Descrição (Visível no cartão):</label>
                    <textarea id="edit-evt-desc" rows="2" placeholder="Detalhes do evento..."></textarea>
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn btn-cancel" onclick="closeModal()">Cancelar</button>
                    <button type="submit" class="btn btn-save">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal de Exportar/Compartilhar -->
    <div class="modal-overlay" id="export-modal-overlay">
        <div class="modal modal-small">
            <div class="modal-header-sticky">
                <h2>📤 Compartilhar Escala</h2>
                <button type="button" class="btn-close-modal" onclick="closeExportModal()">✕</button>
            </div>
            <div class="export-body">
                <label>Semana para compartilhar:</label>
                <select id="export-week-select" onchange="updateExportPreview()"></select>

                <!-- Abas: Link | Texto -->
                <div class="export-tabs">
                    <button type="button" class="export-tab active" id="tab-link" onclick="switchExportTab('link')">
                        🔗 Link para Membros
                    </button>
                    <button type="button" class="export-tab" id="tab-text" onclick="switchExportTab('text')">
                        📝 Texto Simples
                    </button>
                </div>

                <!-- Conteúdo: Link -->
                <div id="export-content-link">
                    <p class="export-hint">Envie este link no grupo do WhatsApp. Os membros vão ver a escala em formato visual e poderão confirmar presença sem precisar instalar nada.</p>
                    <div class="link-box">
                        <input type="text" id="export-link" readonly>
                        <button type="button" class="btn-icon-copy" onclick="copyExportLink()" title="Copiar">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                                <rect x="9" y="9" width="13" height="13" rx="2"/>
                                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                            </svg>
                        </button>
                    </div>
                    <button type="button" class="btn btn-save btn-full" style="margin-top: 15px;" onclick="shareLinkOnWhatsApp()">
                        💬 Enviar no WhatsApp
                    </button>
                </div>

                <!-- Conteúdo: Texto -->
                <div id="export-content-text" style="display: none;">
                    <textarea id="export-text" class="export-textarea" rows="12"></textarea>
                    <div class="export-actions">
                        <button type="button" class="btn btn-secondary" onclick="copyExportText()">📋 Copiar Texto</button>
                        <button type="button" class="btn btn-save" onclick="shareTextOnWhatsApp()">💬 WhatsApp</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
